name: deploy
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-wheels:
    name: Make ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Build wheels
      uses: pypa/cibuildwheel@v4.2.0
      env:
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
        CIBW_BUILD: cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*
        CIBW_SKIP: '*musllinux*'
        CIBW_ARCHS: native
        CIBW_BUILD_FRONTEND: build
        CIBW_TEST_COMMAND: python {project}/TESTS/unitTests.py
          # cross-compilation for Apple Silicon:
          # https://cibuildwheel.readthedocs.io/en/stable/faq/#how-to-cross-compile
        CIBW_ARCHS_MACOS: x86_64 arm64

    - name: Upload wheel as artifact
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.os }}-wheel
        path: ./**/*.whl

  build-sdist:
    name: Make source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - run: pipx run build --sdist

    - uses: actions/upload-artifact@v4
      with:
        name: artifact-source-dist
        path: ./**/dist/*.tar.gz

  publish:
    name: Upload release to (Test) PyPI
    environment: pypi
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    - name: Copy artifacts to dist/ folder
      run: |
        find . -name 'artifact-*' -exec unzip '{}' \;
        mkdir -p dist/
        find . -name '*.tar.gz' -exec mv '{}' dist/ \;
        find . -name '*.whl' -exec mv '{}' dist/ \;
    - name: Publish package to test pypi
      if: github.event_name == 'release' && github.event.action == 'published'
      uses: pypa/gh-action-pypi-publish@v1.13.0
    - name: Publish package to test pypi
      if: github.event_name != 'release'
      uses: pypa/gh-action-pypi-publish@v1.13.0
      with:
        repository-url: https://test.pypi.org/legacy/
