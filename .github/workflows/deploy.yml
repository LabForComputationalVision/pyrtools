name: deploy
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build-wheels:
    name: Make ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Build wheels
      uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
      env:
        CIBW_BUILD: cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*
        CIBW_SKIP: '*musllinux*'
        CIBW_ARCHS: native
        CIBW_BUILD_FRONTEND: build
        CIBW_TEST_COMMAND: python {project}/TESTS/unitTests.py
          # cross-compilation for Apple Silicon:
          # https://cibuildwheel.readthedocs.io/en/stable/faq/#how-to-cross-compile
        CIBW_ARCHS_MACOS: x86_64 arm64

    - name: Upload wheel as artifact
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: artifact-${{ matrix.os }}-wheel
        path: ./**/*.whl

  build-sdist:
    name: Make source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - run: pipx run build --sdist

    - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: artifact-source-dist
        path: ./**/dist/*.tar.gz

  publish:
    name: Upload release to (Test) PyPI
    environment: pypi
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
    - name: Copy artifacts to dist/ folder
      run: |
        find . -name 'artifact-*' -exec unzip '{}' \;
        mkdir -p dist/
        find . -name '*.tar.gz' -exec mv '{}' dist/ \;
        find . -name '*.whl' -exec mv '{}' dist/ \;
    - name: Publish package to test pypi
      if: github.event_name == 'release' && github.event.action == 'published'
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
    - name: Publish package to test pypi
      if: github.event_name != 'release'
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
